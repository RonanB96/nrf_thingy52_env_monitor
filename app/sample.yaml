sample:
  description: BLE Environmental Sensor (ESS, BAS, DIS) for Thingy:52
  name: thingy52_env_monitor
tests:
  sample.bluetooth.mesh.sensor_server:
    sysbuild: true
    build_only: true
    integration_platforms:
      - nrf52dk/nrf52832
      - nrf52840dk/nrf52840
      - thingy53/nrf5340/cpuapp
      - nrf21540dk/nrf52840
      - nrf54l15dk/nrf54l15/cpuapp
      - nrf54l15dk/nrf54l10/cpuapp
      - nrf54l15dk/nrf54l05/cpuapp
    platform_allow:
      - nrf52dk/nrf52832
      - nrf52840dk/nrf52840
      - thingy53/nrf5340/cpuapp
      - nrf21540dk/nrf52840
      - nrf54l15dk/nrf54l15/cpuapp
      - nrf54l15dk/nrf54l10/cpuapp
      - nrf54l15dk/nrf54l05/cpuapp
    tags:
      - bluetooth
      - ci_build
      - sysbuild
  thingy52.env_monitor.hil.shell:
    platform_allow:
      - thingy52/nrf52832
    integration_platforms:
      - thingy52/nrf52832
    extra_args:
      - EXTRA_CONF_FILE=shell.conf
    harness: pytest
    harness_config:
      pytest_root:
        - tests/hardware_shell/pytest
      pytest_dut_scope: session
    timeout: 300
    min_ram: 48
    tags:
      - hil
      - shell
      - gatt
