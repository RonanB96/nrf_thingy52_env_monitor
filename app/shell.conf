# Opt-in GATT-path debug shell. Do not enable in production firmware.

CONFIG_APP_SHELL=y

# Logs and the prompt share the FTDI UART.
CONFIG_SHELL_LOG_BACKEND=y
CONFIG_LOG_BACKEND_UART=n

# Trim RAM on nRF52832. Do not enable Zephyr BT/sensor shells.
CONFIG_SHELL_STACK_SIZE=2048
CONFIG_SHELL_CMD_BUFF_SIZE=128
CONFIG_SHELL_HISTORY=n
CONFIG_SHELL_WILDCARD=n
CONFIG_BT_SHELL=n
CONFIG_SENSOR_SHELL=n
CONFIG_KERNEL_SHELL=n
CONFIG_DEVICE_SHELL=n
